name: Bug Report
description: File a reproducible bug or defect in document parsing, retrieval, or generation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue in Evidence-Grounded Document Intelligence.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise explanation of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or code snippet demonstrating the problem.
      placeholder: |
        1. Ingest document 'example.pdf'
        2. Execute query '...'
        3. Observe error or unexpected response
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to system specification.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Browser, and Vector DB configuration.
      placeholder: Windows 11 / Ubuntu 22.04, Python 3.12, Qdrant 1.9
