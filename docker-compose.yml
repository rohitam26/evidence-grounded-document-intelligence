services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ENV=production
      - DEBUG=false
      - SECRET_KEY=docintel-production-secret-key-change-in-prod-xyz123
      - DATABASE_URL=postgresql://docintel:docintel_pass@postgres:5432/docintel_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
    volumes:
      - docintel-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: docintel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: docintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel_pass
      POSTGRES_DB: docintel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: docintel-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: docintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: docintel-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  docintel-data:
  postgres-data:
  qdrant-data:
  redis-data:
  ollama-models:
